name: Verify monorepo
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: corepack enable && corepack prepare pnpm@12.14.0 --activate
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      - run: pnpm lint
      - run: pnpm build
      - run: pnpm test
      - name: API smoke
        run: |
          DATA_DIR=/tmp/codecash-ci node apps/api/dist/main.js > /tmp/codecash-api.log 2>&1 &
          API_PID=$!
          trap 'kill "$API_PID" || true' EXIT
          for attempt in $(seq 1 30); do
            if curl -sf http://127.0.0.1:3000/api/v1/health; then break; fi
            sleep 1
          done
          pnpm test:e2e
