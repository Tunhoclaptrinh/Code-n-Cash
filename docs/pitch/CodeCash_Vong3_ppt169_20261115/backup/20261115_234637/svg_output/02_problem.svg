    <text font-size="15" fill="#4A5570"><tspan x="532" y="602">Ký hợp đồng, nộp biên bản giao hàng,</tspan><tspan x="532" dy="20">hoá đơn, mở tranh chấp</tspan></text>
    <circle cx="880" cy="586" r="22" fill="#EEF0FB"/>
    <text x="880" y="591" font-size="13" font-weight="bold" fill="#3F4E99" text-anchor="middle">KS</text>
