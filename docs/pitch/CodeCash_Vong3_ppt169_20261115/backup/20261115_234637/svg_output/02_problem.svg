    <text x="148" y="578" font-size="18" font-weight="bold" fill="#1B2437">Bên mua</text>
    <text font-size="15" fill="#4A5570"><tspan x="148" y="602">Chủ hợp đồng, duyệt tài chính,</tspan><tspan x="148" dy="20">duyệt thứ hai, cán bộ hợp đồng</tspan></text>
