    <text x="592" y="422" font-size="20" font-weight="bold" fill="#1B2437">Không trả lời được “vì sao chi”</text>
    <text font-size="18" fill="#4A5570"><tspan x="592" y="450">Chi khoản này theo luật nào, ai duyệt, dựa trên chứng từ nào,</tspan><tspan x="592" dy="24">và có ai sửa kết quả sau đó không.</tspan></text>
