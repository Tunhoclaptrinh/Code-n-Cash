  <g id="pain-3" data-pptx-bounds="504 380 716 112">
    <rect x="508" y="384" width="708" height="104" rx="14" fill="#FFFFFF" stroke="#E3E8F2"/>
    <circle cx="552" cy="428" r="20" fill="#EAF0FF"/>
