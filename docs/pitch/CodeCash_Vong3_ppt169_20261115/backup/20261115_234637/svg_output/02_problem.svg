    <text x="592" y="174" font-size="20" font-weight="bold" fill="#1B2437">Chi khi chưa đủ căn cứ</text>
    <text font-size="18" fill="#4A5570"><tspan x="592" y="202">Thiếu chứng từ, chứng từ do sai bên lập, đang tranh chấp</tspan><tspan x="592" dy="24">hoặc đã có phiếu từ chối mà tiền vẫn đi.</tspan></text>
