    <text x="92" y="240" font-size="56" font-weight="bold" fill="#FFFFFF">56.452</text>
    <text x="92" y="272" font-size="20" fill="#C9D6FA">triệu đồng</text>
    <text font-size="18" fill="#FFFFFF"><tspan x="92" y="318">ở 42 mốc chưa đủ điều kiện chi.</tspan><tspan x="92" dy="28">Hệ “luôn chi đủ” sẽ chi hết số tiền này;</tspan><tspan x="92" dy="28">CodeCash tạm giữ hoặc từ chối, kèm lý do.</tspan></text>
