  <g id="pain-2" data-pptx-bounds="504 256 716 112">
    <rect x="508" y="260" width="708" height="104" rx="14" fill="#FFFFFF" stroke="#E3E8F2"/>
    <circle cx="552" cy="304" r="20" fill="#FFF1DC"/>
    <text x="552" y="311" font-size="18" font-weight="bold" fill="#8F4A06" text-anchor="middle">2</text>
    <text x="592" y="298" font-size="20" font-weight="bold" fill="#1B2437">Tính phạt trễ hạn dễ nhầm</text>
    <text font-size="18" fill="#4A5570"><tspan x="592" y="326">Ân hạn, trần phạt, ngày hoàn thành: duyệt muộn không được</tspan><tspan x="592" dy="24">làm nhà cung cấp bị phạt thêm.</tspan></text>
