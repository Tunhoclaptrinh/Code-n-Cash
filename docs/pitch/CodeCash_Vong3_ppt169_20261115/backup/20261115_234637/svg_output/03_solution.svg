      <rect x="258" y="314" width="196" height="80" rx="12" fill="#FFFFFF" stroke="#E3E8F2"/>
      <text x="274" y="342" font-size="15" font-weight="bold" fill="#1B2437">Nhật ký chuỗi băm</text>
      <text x="274" y="366" font-size="13" fill="#4A5570">chỉ ghi thêm · neo 15 phút</text>
    </g>
    <g id="node-store">
      <rect x="476" y="314" width="188" height="80" rx="12" fill="#FFFFFF" stroke="#E3E8F2"/>
      <text x="492" y="342" font-size="15" font-weight="bold" fill="#1B2437">Lưu trữ</text>
      <text x="492" y="366" font-size="13" fill="#4A5570">MongoDB hoặc tệp</text>
    </g>
    <g id="node-output">
      <rect x="686" y="314" width="178" height="80" rx="12" fill="#E4F6EC" stroke="#0F6A3C"/>
      <text x="702" y="342" font-size="15" font-weight="bold" fill="#0F6A3C">Quyết định + tiền</text>
      <text x="702" y="366" font-size="13" fill="#0F6A3C">luật · căn cứ · độ tin cậy</text>
    </g>
    <line x1="570" y1="408" x2="570" y2="440" stroke="#6B7691" stroke-width="1.5" stroke-dasharray="6,4" marker-end="url(#arrowGray)"/>
    <rect x="64" y="444" width="800" height="104" rx="14" fill="none" stroke="#9AA6C0" stroke-dasharray="6,4"/>
    <text x="84" y="470" font-size="13" font-weight="bold" fill="#6B7691">BÊN NGOÀI · MÔ PHỎNG HOẶC TUỲ CHỌN, KHÔNG QUYẾT ĐỊNH THANH TOÁN</text>
    <g font-size="15" fill="#1B2437">
      <text x="84" y="502" font-weight="bold">Ký số</text>
      <text x="84" y="526" font-size="13" fill="#4A5570">chứng thư mô phỏng</text>
      <text x="324" y="502" font-weight="bold">Cổng thanh toán</text>
      <text x="324" y="526" font-size="13" fill="#4A5570">mô phỏng · khoá chống trùng, HMAC</text>
      <text x="620" y="502" font-weight="bold">Gemini (tuỳ chọn)</text>
      <text x="620" y="526" font-size="13" fill="#4A5570">chỉ đề xuất điều khoản từ PDF</text>
    </g>
  </g>
  <g id="decisions" data-pptx-bounds="900 128 324 448">
    <text x="904" y="150" font-size="13" font-weight="bold" fill="#6B7691">BỐN QUYẾT ĐỊNH CHO MỖI MỐC</text>
    <rect x="904" y="164" width="312" height="90" rx="12" fill="#FFFFFF" stroke="#E3E8F2"/>
    <rect x="920" y="178" width="78" height="24" rx="12" fill="#E4F6EC"/>
    <text x="959" y="195" font-size="13" font-weight="bold" fill="#0F6A3C" text-anchor="middle">Chi đủ</text>
    <text x="1008" y="195" font-size="13" fill="#6B7691">RELEASE</text>
    <text x="920" y="232" font-size="15" fill="#4A5570">Đủ mọi điều kiện, chi đúng giá trị mốc</text>
    <rect x="904" y="266" width="312" height="90" rx="12" fill="#FFFFFF" stroke="#E3E8F2"/>
    <rect x="920" y="280" width="132" height="24" rx="12" fill="#FFF1DC"/>
    <text x="986" y="297" font-size="13" font-weight="bold" fill="#8F4A06" text-anchor="middle">Chi sau trừ phạt</text>
    <text x="1062" y="297" font-size="13" fill="#6B7691">PENALTY</text>
    <text x="920" y="334" font-size="15" fill="#4A5570">Xong sau hạn + ân hạn: trừ phạt rồi chi</text>
    <rect x="904" y="368" width="312" height="104" rx="12" fill="#FFFFFF" stroke="#E3E8F2"/>
    <rect x="920" y="382" width="82" height="24" rx="12" fill="#FFF6D6"/>
    <text x="961" y="399" font-size="13" font-weight="bold" fill="#7A5A00" text-anchor="middle">Tạm giữ</text>
    <text x="1012" y="399" font-size="13" fill="#6B7691">HOLD</text>
    <text font-size="15" fill="#4A5570"><tspan x="920" y="434">Tranh chấp, thiếu chứng từ hoặc phê</tspan><tspan x="920" dy="22">duyệt, sai thẩm quyền, dữ liệu lỗi</tspan></text>
    <rect x="904" y="484" width="312" height="86" rx="12" fill="#FFFFFF" stroke="#E3E8F2"/>
    <rect x="920" y="498" width="78" height="24" rx="12" fill="#FDECEC"/>
    <text x="959" y="515" font-size="13" font-weight="bold" fill="#B42318" text-anchor="middle">Từ chối</text>
    <text x="1008" y="515" font-size="13" fill="#6B7691">REJECT</text>
    <text x="920" y="550" font-size="15" fill="#4A5570">Có phiếu từ chối hợp lệ</text>
  </g>
  <g id="principles" data-pptx-bounds="56 586 1168 100">
    <rect x="64" y="590" width="1152" height="92" rx="14" fill="#FFFFFF" stroke="#E3E8F2"/>
    <text font-size="15" fill="#4A5570"><tspan x="88" y="626" font-weight="bold" fill="#1B2437">Luật là dữ liệu</tspan><tspan x="88" dy="22">Đọc bảng luật BTC, khớp luật đầu tiên theo ưu tiên</tspan></text>
    <text font-size="15" fill="#4A5570"><tspan x="476" y="626" font-weight="bold" fill="#1B2437">Nghi ngờ thì tạm giữ</tspan><tspan x="476" dy="22">Nhánh cuối luôn là HOLD; chốt chặn luật trả tiền</tspan></text>
    <text font-size="15" fill="#4A5570"><tspan x="864" y="626" font-weight="bold" fill="#1B2437">Không ai sửa kết quả</tspan><tspan x="864" dy="22">Chỉ sự kiện mới, hoặc ngoại lệ 2 người duyệt</tspan></text>
  </g>
  <g id="page-number" data-pptx-role="page-number" data-pptx-bounds="1150 690 70 22">
    <text x="1216" y="706" font-size="13" fill="#9AA6C0" text-anchor="end">03</text>
  </g>
</svg>
