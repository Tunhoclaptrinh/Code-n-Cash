<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" width="1280" height="720" lang="vi-VN" data-pptx-page-role="content" font-family="Plus Jakarta Sans">
  <defs>
    <marker id="arrowBlue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <polygon points="0,0 10,5 0,10" fill="#3D68E4"/>
    </marker>
    <marker id="arrowGray" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <polygon points="0,0 10,5 0,10" fill="#6B7691"/>
    </marker>
  </defs>
  <rect id="bg" data-pptx-role="background" x="0" y="0" width="1280" height="720" fill="#F5F7FB"/>
  <g id="header" data-pptx-bounds="56 30 1170 92">
    <rect x="64" y="38" width="176" height="26" rx="13" fill="#EAF0FF"/>
    <text x="78" y="56" font-size="13" font-weight="bold" fill="#2F52B8">Giải pháp và kiến trúc</text>
    <text x="64" y="106" font-size="32" font-weight="bold" fill="#1B2437">Mỗi thao tác là một sự kiện; engine chấm lại mốc kèm căn cứ</text>
  </g>
  <g id="architecture" data-pptx-bounds="56 128 828 448">
    <rect x="238" y="132" width="642" height="276" rx="16" fill="#EAF0FF" stroke="#C9D6FA"/>
    <text x="258" y="158" font-size="13" font-weight="bold" fill="#2F52B8">CODECASH · ĐỘI TỰ XÂY DỰNG</text>
    <g id="node-user">
      <rect x="64" y="176" width="152" height="96" rx="12" fill="#FFFFFF" stroke="#E3E8F2"/>
      <text x="80" y="208" font-size="18" font-weight="bold" fill="#1B2437">Người dùng</text>
      <text font-size="13" fill="#4A5570"><tspan x="80" y="232">8 vai trò, mỗi bên</tspan><tspan x="80" dy="18">chỉ thấy việc mình</tspan></text>
    </g>
    <line x1="216" y1="224" x2="254" y2="224" stroke="#3D68E4" stroke-width="2" marker-end="url(#arrowBlue)"/>
    <g id="node-web">
      <rect x="258" y="176" width="176" height="96" rx="12" fill="#FFFFFF" stroke="#3D68E4" stroke-width="1.5"/>
      <text x="274" y="208" font-size="18" font-weight="bold" fill="#1B2437">Web</text>
      <text font-size="13" fill="#4A5570"><tspan x="274" y="232">React 19 · Ant Design</tspan><tspan x="274" dy="18">hiển thị, không tự tính</tspan></text>
    </g>
    <line x1="434" y1="224" x2="472" y2="224" stroke="#3D68E4" stroke-width="2" marker-end="url(#arrowBlue)"/>
    <g id="node-api">
      <rect x="476" y="176" width="188" height="96" rx="12" fill="#FFFFFF" stroke="#3D68E4" stroke-width="1.5"/>
      <text x="492" y="208" font-size="18" font-weight="bold" fill="#1B2437">API</text>
      <text font-size="13" fill="#4A5570"><tspan x="492" y="232">NestJS · danh tính, phạm vi,</tspan><tspan x="492" dy="18">quyền và giao dịch</tspan></text>
    </g>
    <line x1="664" y1="224" x2="682" y2="224" stroke="#3D68E4" stroke-width="2" marker-end="url(#arrowBlue)"/>
    <g id="node-engine">
      <rect x="686" y="176" width="178" height="96" rx="12" fill="#1B2437"/>
      <text x="702" y="208" font-size="18" font-weight="bold" fill="#FFFFFF">Engine</text>
      <text font-size="13" fill="#C9D6FA"><tspan x="702" y="232">Python · Decimal</tspan><tspan x="702" dy="18">9 bước cho mỗi mốc</tspan></text>
    </g>
    <line x1="570" y1="272" x2="570" y2="310" stroke="#3D68E4" stroke-width="2" marker-end="url(#arrowBlue)"/>
    <line x1="520" y1="272" x2="400" y2="310" stroke="#3D68E4" stroke-width="2" marker-end="url(#arrowBlue)"/>
    <line x1="775" y1="272" x2="775" y2="310" stroke="#3D68E4" stroke-width="2" marker-end="url(#arrowBlue)"/>
