    <text font-size="15" fill="#4A5570"><tspan x="580" y="222">Biên bản nghiệm thu EV01006 (mốc 255 triệu) do nhà cung cấp S008 lập;</tspan><tspan x="580" dy="21">nghiệm thu phải do bên mua lập, nên không được coi là căn cứ.</tspan></text>
