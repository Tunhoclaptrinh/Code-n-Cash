    <text font-size="14" fill="#1B2437"><tspan x="852" y="454">• Ký qua tổ chức chứng thực được cấp phép</tspan><tspan x="852" dy="30">• Nối cổng ngân hàng qua adapter sẵn có</tspan><tspan x="852" dy="30">• Chốt các điểm BTC còn mở, cập nhật luật</tspan><tspan x="852" dy="30">• Phụ lục đổi giá trị hoặc tỷ lệ thanh toán</tspan><tspan x="852" dy="30">• Bằng chứng độc lập: bộ lỗi giữ lại,</tspan><tspan x="868" dy="20">đáp án do người không viết engine gán</tspan></text>
