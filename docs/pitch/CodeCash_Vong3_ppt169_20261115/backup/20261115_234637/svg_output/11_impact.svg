    <text font-size="14" fill="#1B2437"><tspan x="84" y="454">• Engine 4 quyết định trên 405 mốc</tspan><tspan x="84" dy="26">• Ký theo trình tự, chứng từ, duyệt, tranh chấp</tspan><tspan x="84" dy="26">• Chạy thử trước khi ghi; lệnh chi chống trùng</tspan><tspan x="84" dy="26">• Ngoại lệ hai người; 8 vai trò kiểm ở API</tspan><tspan x="84" dy="26">• Nhật ký chuỗi băm, neo Merkle 15 phút</tspan><tspan x="84" dy="26">• Phiên bản luật: chạy thử trên 405 mốc</tspan><tspan x="84" dy="26">• Gói kiểm chứng độc lập; Docker, CI</tspan></text>
  </g>
