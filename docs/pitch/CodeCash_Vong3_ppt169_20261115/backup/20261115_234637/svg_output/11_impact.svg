    <text font-size="14" fill="#1B2437"><tspan x="468" y="454">• Ký số với chứng thư mô phỏng</tspan><tspan x="468" dy="30">• Cổng thanh toán mô phỏng: adapter</tspan><tspan x="484" dy="20">HTTP, khoá chống trùng, chữ ký HMAC</tspan><tspan x="468" dy="30">• AI đọc PDF (Gemini): chỉ đề xuất 6 điều</tspan><tspan x="484" dy="20">khoản kèm trang, người xác nhận;</tspan><tspan x="484" dy="20">không tham gia quyết định thanh toán</tspan></text>
  </g>
