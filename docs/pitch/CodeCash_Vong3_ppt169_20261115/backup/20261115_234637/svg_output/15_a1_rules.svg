      <rect x="168" y="240" width="84" height="24" rx="12" fill="#FDECEC"/><text x="210" y="257" fill="#B42318">Từ chối</text>
      <rect x="168" y="288" width="84" height="24" rx="12" fill="#FFF6D6"/><text x="210" y="305" fill="#7A5A00">Tạm giữ</text>
      <rect x="168" y="336" width="84" height="24" rx="12" fill="#FFF6D6"/><text x="210" y="353" fill="#7A5A00">Tạm giữ</text>
