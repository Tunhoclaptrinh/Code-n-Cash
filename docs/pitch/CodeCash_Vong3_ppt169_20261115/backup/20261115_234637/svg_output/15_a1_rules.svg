  <g id="notes" data-pptx-bounds="56 584 1168 84">
    <rect x="64" y="588" width="564" height="76" rx="12" fill="#EAF0FF"/>
    <text font-size="15" fill="#1B2437"><tspan x="84" y="616" font-weight="bold">Luật là dữ liệu</tspan><tspan x="84" dy="22" font-size="13" fill="#4A5570">128 dòng · 4 bộ luật · 16 mã luật. Bộ luật chỉ hợp lệ khi ưu tiên</tspan><tspan x="84" dy="18" font-size="13" fill="#4A5570">không trùng, ELSE ở cuối; đổi luật phải chạy thử trên 405 mốc.</tspan></text>
    <rect x="652" y="588" width="564" height="76" rx="12" fill="#1B2437"/>
    <text font-size="15" fill="#FFFFFF"><tspan x="672" y="616" font-weight="bold">Chốt an toàn độc lập với bảng luật</tspan><tspan x="672" dy="22" font-size="13" fill="#C9D6FA">Còn tranh chấp mở, có từ chối hợp lệ hoặc thiếu điều kiện thì</tspan><tspan x="672" dy="18" font-size="13" fill="#C9D6FA">mọi luật trả tiền bị đưa về ELSE (tạm giữ), dù bảng luật sai.</tspan></text>
  </g>
  <g id="page-number" data-pptx-role="page-number" data-pptx-bounds="1150 690 70 22">
