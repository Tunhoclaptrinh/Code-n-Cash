    <text font-size="13" fill="#1B2437"><tspan x="932" y="176" font-weight="bold">Đọc ra từ dữ liệu</tspan><tspan x="932" dy="20">CSV không có khoá ngoại vật lý;</tspan><tspan x="932" dy="18">đội kiểm 5/5 quan hệ đều khớp.</tspan><tspan x="932" dy="18">Mỗi bên mua có đúng 3 người duyệt:</tspan><tspan x="932" dy="18">chủ HĐ, tài chính, duyệt thứ hai.</tspan></text>
