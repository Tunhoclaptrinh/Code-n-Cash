    <g stroke="#F0F2F6"><line x1="472" y1="238" x2="1196" y2="238"/><line x1="472" y1="302" x2="1196" y2="302"/><line x1="472" y1="366" x2="1196" y2="366"/><line x1="472" y1="430" x2="1196" y2="430"/><line x1="472" y1="494" x2="1196" y2="494"/></g>
    <text font-size="12" fill="#6B7691"><tspan x="472" y="574">CO chủ hợp đồng · FA duyệt tài chính · SA duyệt thứ hai · LR cán bộ hợp đồng · SUP nhà cung cấp</tspan><tspan x="472" dy="16">AA kiểm soát viên của từng bên · SYS quản trị hệ thống · AUD kiểm tra toàn vẹn</tspan></text>
