      <text x="472" y="418">Duyệt lệnh chi</text>
      <text x="472" y="450">Đề xuất vô hiệu chứng từ</text>
      <text x="472" y="482">Duyệt ngoại lệ (người thứ hai)</text>
      <text x="472" y="514">Tài khoản, cấu hình, phiên bản luật</text>
      <text x="472" y="546">Đọc, xuất nhật ký kiểm toán</text>
    </g>
