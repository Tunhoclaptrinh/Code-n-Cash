      <circle cx="770" cy="222" r="7"/><circle cx="944" cy="222" r="7"/>
      <circle cx="770" cy="254" r="7"/><circle cx="828" cy="254" r="7"/><circle cx="886" cy="254" r="7"/><circle cx="944" cy="254" r="7"/><circle cx="1002" cy="254" r="7" fill="#D9822B"/>
