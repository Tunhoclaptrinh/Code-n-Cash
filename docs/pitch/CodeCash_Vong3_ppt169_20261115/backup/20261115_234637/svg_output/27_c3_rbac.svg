    </g>
    <line x1="472" y1="200" x2="1196" y2="200" stroke="#E3E8F2"/>
    <g font-size="13" fill="#1B2437">
      <text x="472" y="226">Soạn, số hoá, gửi ký hợp đồng</text>
      <text x="472" y="258">Ký hợp đồng (đúng bước của mình)</text>
      <text x="472" y="290">Nộp chứng từ</text>
      <text x="472" y="322">Phê duyệt hoặc từ chối mốc</text>
      <text x="472" y="354">Mở tranh chấp</text>
