      <circle cx="828" cy="414" r="7"/>
      <circle cx="770" cy="446" r="7"/>
      <circle cx="1060" cy="478" r="7" fill="#3F4E99"/>
      <circle cx="1118" cy="510" r="7" fill="#4A5570"/>
      <circle cx="1118" cy="542" r="7" fill="#4A5570"/><circle cx="1176" cy="542" r="7" fill="#4A5570"/>
