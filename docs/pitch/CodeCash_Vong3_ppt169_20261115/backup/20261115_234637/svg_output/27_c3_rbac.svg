<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" width="1280" height="720" lang="vi-VN" data-pptx-page-role="content" font-family="Plus Jakarta Sans">
  <rect id="bg" data-pptx-role="background" x="0" y="0" width="1280" height="720" fill="#F5F7FB"/>
  <g id="kicker" data-pptx-bounds="56 30 380 40">
    <rect x="64" y="38" width="262" height="26" rx="13" fill="#1B2437"/>
    <text x="78" y="56" font-size="13" font-weight="bold" fill="#FFFFFF">Phụ lục C3 · Quy trình, phân quyền</text>
  </g>
  <g id="title" data-pptx-bounds="56 72 1170 52">
    <text x="64" y="106" font-size="32" font-weight="bold" fill="#1B2437">Hai lớp quyền: bên nào lập chứng từ gì, ai được làm gì</text>
  </g>
  <g id="layer-event" data-pptx-bounds="56 128 384 476">
    <rect x="64" y="132" width="368" height="468" rx="14" fill="#FFFFFF" stroke="#E3E8F2"/>
    <text x="88" y="162" font-size="13" font-weight="bold" fill="#6B7691">LỚP 1 · THẨM QUYỀN CHỨNG TỪ (ENGINE)</text>
    <rect x="88" y="178" width="320" height="104" rx="10" fill="#FFF1DC"/>
    <text font-size="15" font-weight="bold" fill="#8F4A06"><tspan x="104" y="204">Nhà cung cấp lập</tspan><tspan x="104" dy="22" font-family="Consolas" font-size="12" font-weight="normal" fill="#1B2437">DELIVERY · INVOICE · GO_LIVE</tspan><tspan x="104" dy="18" font-family="Consolas" font-size="12" font-weight="normal" fill="#1B2437">SERVICE_ACTIVATED · SERVICE_COMPLETED</tspan><tspan x="104" dy="18" font-family="Consolas" font-size="12" font-weight="normal" fill="#1B2437">WARRANTY_COMPLETED</tspan></text>
    <rect x="88" y="292" width="320" height="104" rx="10" fill="#EAF0FF"/>
    <text font-size="15" font-weight="bold" fill="#2F52B8"><tspan x="104" y="318">Bên mua lập</tspan><tspan x="104" dy="22" font-family="Consolas" font-size="12" font-weight="normal" fill="#1B2437">CONTRACT_SIGNED · ACCEPTANCE</tspan><tspan x="104" dy="18" font-family="Consolas" font-size="12" font-weight="normal" fill="#1B2437">KICKOFF_CONFIRMED · UAT_PASSED</tspan><tspan x="104" dy="18" font-family="Consolas" font-size="12" font-weight="normal" fill="#1B2437">REQUIREMENTS_APPROVED</tspan></text>
    <rect x="88" y="406" width="320" height="86" rx="10" fill="#EEF0FB"/>
    <text font-size="15" font-weight="bold" fill="#3F4E99"><tspan x="104" y="432">Người duyệt của bên mua</tspan><tspan x="104" dy="22" font-family="Consolas" font-size="12" font-weight="normal" fill="#1B2437">APPROVAL · REJECTION</tspan><tspan x="104" dy="18" font-size="12" font-weight="normal" fill="#4A5570">đếm theo vai trò, có hạn mức</tspan></text>
    <text font-size="13" fill="#4A5570"><tspan x="88" y="522">Tranh chấp: bên nào cũng mở được; đóng phải</tspan><tspan x="88" dy="18">tham chiếu đúng lần mở. Sai bên lập thì chứng</tspan><tspan x="88" dy="18">từ không là căn cứ, mốc bị tạm giữ (luật 30).</tspan></text>
  </g>
