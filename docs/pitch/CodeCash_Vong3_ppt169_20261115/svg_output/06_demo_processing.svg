    <text font-size="13" fill="#6B7691"><tspan x="88" y="552">10 tranh chấp · 20 từ chối · 30 sai thẩm quyền · 40 thiếu chứng từ</tspan><tspan x="88" dy="18">50 thiếu duyệt · 60 trễ hạn · 70 đủ điều kiện · 80 còn lại → tạm giữ</tspan></text>
