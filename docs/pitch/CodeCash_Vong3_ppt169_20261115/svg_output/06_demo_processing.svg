    <text font-size="16" font-weight="bold" fill="#1B2437"><tspan x="132" y="278">Trễ = 16/10 − 14/10 = 2 ngày</tspan><tspan x="132" dy="23" font-size="15" font-weight="normal" fill="#4A5570">hạn 12/10 cộng 2 ngày ân hạn</tspan></text>
    <text font-size="16" font-weight="bold" fill="#1B2437"><tspan x="132" y="350">Phạt = 0,15% × 2 × 740 = 2,22 triệu</tspan><tspan x="132" dy="23" font-size="15" font-weight="normal" fill="#4A5570">trần 8% × 740 = 59,20 · chưa chạm trần</tspan></text>
