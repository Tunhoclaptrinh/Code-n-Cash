    <text font-size="13" fill="#4A5570"><tspan x="488" y="586" font-weight="bold" fill="#1B2437">Tái lập: python apps/engine/cli.py --output out → out/metrics.json</tspan><tspan x="488" dy="20">Cột CodeCash và baseline cùng ở trong metrics.json · 33 kịch bản do đội gán đáp án:</tspan><tspan x="488" dy="18">chứng minh “làm đúng điều đội hiểu”, độ chính xác thật chờ 250 mốc ẩn và 135 mốc holdout</tspan></text>
