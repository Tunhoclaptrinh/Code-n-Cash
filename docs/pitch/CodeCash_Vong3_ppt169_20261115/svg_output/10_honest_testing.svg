    <text font-size="13" fill="#4A5570"><tspan x="88" y="480" font-size="16" font-weight="bold" fill="#1B2437">Ít nhãn để đo</tspan><tspan x="88" dy="24">20 mẫu, engine viết khi đã đọc;</tspan><tspan x="88" dy="18">CI 95% là 83,9–100%.</tspan><tspan x="88" dy="26" fill="#2F52B8">→ Chờ tập ẩn; nhờ người không viết</tspan><tspan x="88" dy="18" fill="#2F52B8">engine gán nhãn độc lập khoảng 30 ca</tspan></text>
    <text font-size="13" fill="#4A5570"><tspan x="370" y="480" font-size="16" font-weight="bold" fill="#1B2437">2 điểm BTC chưa chốt</tspan><tspan x="370" dy="24">Hoá đơn khi invoice_required; ai</tspan><tspan x="370" dy="18">được đóng tranh chấp.</tspan><tspan x="370" dy="26" fill="#2F52B8">→ Đo độ nhạy, hạ độ tin cậy;</tspan><tspan x="370" dy="18" fill="#2F52B8">không đổi quyết định</tspan></text>
    <text font-size="13" fill="#4A5570"><tspan x="652" y="480" font-size="16" font-weight="bold" fill="#1B2437">Ký số, thanh toán mô phỏng</tspan><tspan x="652" dy="24">Chưa có giá trị pháp lý,</tspan><tspan x="652" dy="18">chưa chi tiền thật.</tspan><tspan x="652" dy="26" fill="#2F52B8">→ Adapter HTTP đã có (khoá chống</tspan><tspan x="652" dy="18" fill="#2F52B8">trùng, HMAC); nối CA và ngân hàng</tspan></text>
    <text font-size="13" fill="#4A5570"><tspan x="934" y="480" font-size="16" font-weight="bold" fill="#1B2437">Làm chứng cùng máy chủ</tspan><tspan x="934" dy="24">Neo nội bộ mỗi 15 phút; phát</tspan><tspan x="934" dy="18">hiện 5/6 kiểu giả mạo đã thử.</tspan><tspan x="934" dy="26" fill="#2F52B8">→ Bật dấu thời gian RFC 3161</tspan><tspan x="934" dy="18" fill="#2F52B8">của đơn vị bên ngoài</tspan></text>
    <text x="88" y="628" font-size="13" fill="#6B7691">An toàn bộ luật: 16/16 phạm vi luật qua chứng minh tĩnh trên 9.216 tình huống · 33 kịch bản tổng hợp, đáp án do đội viết</text>
