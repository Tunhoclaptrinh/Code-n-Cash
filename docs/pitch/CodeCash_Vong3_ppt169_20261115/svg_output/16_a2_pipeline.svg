  <g id="formula" data-pptx-bounds="56 332 584 334">
    <rect x="64" y="336" width="568" height="326" rx="14" fill="#FFFFFF" stroke="#E3E8F2"/>
    <text x="88" y="366" font-size="13" font-weight="bold" fill="#6B7691">CÔNG THỨC TIỀN · DECIMAL, KHÔNG DÙNG SỐ THỰC</text>
    <text font-size="20" font-weight="bold" fill="#1B2437"><tspan x="88" y="406">F = min(trễ × mức phạt × P, trần × P)</tspan><tspan x="88" dy="34">Được chi = max(0, P − F)</tspan></text>
    <text font-size="15" fill="#4A5570"><tspan x="88" y="476">P: giá trị mốc · trễ: số ngày sau hạn cộng ân hạn</tspan><tspan x="88" dy="22">F làm tròn tới 0,01 triệu (ROUND_HALF_UP) rồi mới trừ</tspan></text>
    <rect x="88" y="512" width="520" height="130" rx="10" fill="#F8FAFD" stroke="#E3E8F2"/>
    <text font-size="15" fill="#1B2437"><tspan x="104" y="540" font-weight="bold">CT0103 · mốc 2</tspan><tspan x="104" dy="22" fill="#4A5570">min(2 × 0,15% × 740; 8% × 740) = 2,22 → chi 737,78</tspan><tspan x="104" dy="30" font-weight="bold">K10 · mức phạt tăng lên 2%/ngày</tspan><tspan x="104" dy="22" fill="#4A5570">chạm trần 8% × 900 = 72,00 → chi 828,00</tspan></text>
  </g>
  <g id="completion" data-pptx-bounds="640 332 584 334">
    <rect x="648" y="336" width="568" height="326" rx="14" fill="#FFFFFF" stroke="#E3E8F2"/>
    <text x="672" y="366" font-size="13" font-weight="bold" fill="#6B7691">NGÀY HOÀN THÀNH · NGUỒN GỐC CỦA TIỀN PHẠT</text>
    <text font-size="18" font-weight="bold" fill="#1B2437"><tspan x="672" y="402">= chứng từ bắt buộc hợp lệ muộn nhất</tspan></text>
    <text font-size="15" fill="#4A5570"><tspan x="672" y="440">• Không tính phê duyệt: K11 duyệt muộn 17 ngày,</tspan><tspan x="688" dy="22">phạt vẫn 8,10 như cũ</tspan><tspan x="672" dy="30">• Không tính lần đóng tranh chấp</tspan><tspan x="672" dy="30">• Bản lặp cùng số chứng từ: giữ bản sớm nhất</tspan><tspan x="672" dy="30">• Chứng từ do sai bên lập không được tính</tspan></text>
    <rect x="672" y="590" width="520" height="52" rx="10" fill="#FFF6D6"/>
    <text font-size="13" fill="#7A5A00"><tspan x="688" y="612" font-weight="bold">Dữ liệu lỗi → ELSE, tạm giữ, độ tin cậy tối đa 0,50</tspan><tspan x="688" dy="18">ví dụ quorum “?”, thiếu danh sách chứng từ bắt buộc</tspan></text>
  </g>
