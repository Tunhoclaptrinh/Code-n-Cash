      <rect x="776" y="362" width="72" height="24" rx="12" fill="#FFF1DC"/><text x="812" y="379" text-anchor="middle">CT0103</text>
      <rect x="776" y="452" width="72" height="24" rx="12" fill="#FFF1DC"/><text x="812" y="469" text-anchor="middle">CT0104</text>
    </g>
    <text font-size="15" font-weight="bold" fill="#1B2437"><tspan x="864" y="200">Đã tải lên, chưa số hoá</tspan><tspan x="864" dy="22" font-size="13" font-weight="normal" fill="#4A5570">điểm bắt đầu của luồng tải lên và số hoá</tspan><tspan x="864" dy="18" font-size="13" font-weight="normal" fill="#4A5570">điều khoản</tspan></text>
    <text font-size="15" font-weight="bold" fill="#1B2437"><tspan x="864" y="290">Ký theo trình tự 3 bước</tspan><tspan x="864" dy="22" font-size="13" font-weight="normal" fill="#4A5570">chủ hợp đồng đã ký; nhà cung cấp ký tiếp,</tspan><tspan x="864" dy="18" font-size="13" font-weight="normal" fill="#4A5570">duyệt cấp 2 ký cuối</tspan></text>
    <text font-size="15" font-weight="bold" fill="#1B2437"><tspan x="864" y="380">Ca điển hình của demo</tspan><tspan x="864" dy="22" font-size="13" font-weight="normal" fill="#4A5570">giao hàng sau hạn cuối 2 ngày, chờ duyệt</tspan><tspan x="864" dy="18" font-size="13" font-weight="normal" fill="#4A5570">tài chính</tspan></text>
    <text font-size="15" font-weight="bold" fill="#1B2437"><tspan x="864" y="470">Bảo trì quá hạn</tspan><tspan x="864" dy="22" font-size="13" font-weight="normal" fill="#4A5570">kích hoạt đã chi; hoàn thành dịch vụ quá</tspan><tspan x="864" dy="18" font-size="13" font-weight="normal" fill="#4A5570">hạn mà chưa nộp chứng từ</tspan></text>
  </g>
  <g id="guarantees" data-pptx-bounds="56 568 1168 96">
    <rect x="64" y="572" width="1152" height="88" rx="14" fill="#1B2437"/>
    <text font-size="15" fill="#FFFFFF"><tspan x="88" y="604" font-weight="bold">Mọi dòng bổ sung mang nhãn SEED</tspan><tspan x="88" dy="24" font-size="13" fill="#C9D6FA">tách bạch với dữ liệu BTC trên mọi màn hình</tspan></text>
    <text font-size="15" fill="#FFFFFF"><tspan x="476" y="604" font-weight="bold">Không đổi kết quả 405 mốc gốc</tspan><tspan x="476" dy="24" font-size="13" fill="#C9D6FA">golden snapshot kiểm mọi thay đổi engine</tspan></text>
    <text font-size="15" fill="#FFFFFF"><tspan x="864" y="604" font-weight="bold">Khôi phục dữ liệu demo an toàn</tspan><tspan x="864" dy="24" font-size="13" fill="#C9D6FA">bản cũ và nhật ký được lưu trữ, không xoá</tspan></text>
