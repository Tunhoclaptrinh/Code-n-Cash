  </g>
  <g id="title" data-pptx-bounds="56 72 1170 52">
    <text x="64" y="106" font-size="32" font-weight="bold" fill="#1B2437">Làm giàu dữ liệu: chỉ bổ sung thứ Data Pack không có</text>
  </g>
  <g id="gap-table" data-pptx-bounds="56 128 680 432">
    <rect x="64" y="132" width="664" height="424" rx="14" fill="#FFFFFF" stroke="#E3E8F2"/>
    <g font-size="13" font-weight="bold" fill="#6B7691">
      <text x="88" y="162">DATA PACK THIẾU</text><text x="360" y="162">ĐỘI BỔ SUNG (NHÃN SEED)</text>
    </g>
    <line x1="88" y1="176" x2="704" y2="176" stroke="#E3E8F2"/>
    <g font-size="15" font-weight="bold" fill="#1B2437">
      <text x="88" y="206">Người dùng</text>
      <text x="88" y="282">Pháp lý tổ chức</text>
      <text x="88" y="358">Chi tiết ký số</text>
      <text x="88" y="434">Bước đã qua</text>
      <text x="88" y="510">Cấu hình chạy</text>
    </g>
    <g font-size="13" fill="#4A5570">
      <text x="88" y="226">tên, email, chức danh</text>
      <text x="88" y="302">mã số thuế, địa chỉ</text>
      <text x="88" y="378">thứ tự ký, phương thức</text>
      <text x="88" y="454">tải lên, ký, duyệt trực tiếp</text>
      <text x="88" y="530">chế độ đánh giá, bên demo</text>
    </g>
    <g font-size="15" fill="#1B2437">
      <text><tspan x="360" y="206">102 tài khoản, mỗi tài khoản gắn đúng một bên</tspan><tspan x="360" dy="20" font-size="13" fill="#4A5570">trong parties.csv (cách ánh xạ ở trang 22)</tspan></text>
      <text><tspan x="360" y="282">In trên hợp đồng, kiểm ký hiệu, số, mã số thuế</tspan><tspan x="360" dy="20" font-size="13" fill="#4A5570">và tổng tiền khi nộp hoá đơn</tspan></text>
      <text><tspan x="360" y="358">100 bản ký: thứ tự theo approval_policy, bên mua</tspan><tspan x="360" dy="20" font-size="13" fill="#4A5570">ký cuối, đúng thời điểm sự kiện CONTRACT_SIGNED</tspan></text>
      <text><tspan x="360" y="434">4 hợp đồng demo Nova An ↔ Phú Minh</tspan><tspan x="360" dy="20" font-size="13" fill="#4A5570">cắt mốc bằng đúng quy trình của Data Pack</tspan></text>
      <text><tspan x="360" y="510">EVALUATION_MODE = offline_full_history</tspan><tspan x="360" dy="20" font-size="13" fill="#4A5570">DEMO_BUYER = B010 · DEMO_SUPPLIER = S015</tspan></text>
    </g>
    <g stroke="#F0F2F6"><line x1="88" y1="248" x2="704" y2="248"/><line x1="88" y1="324" x2="704" y2="324"/><line x1="88" y1="400" x2="704" y2="400"/><line x1="88" y1="476" x2="704" y2="476"/></g>
