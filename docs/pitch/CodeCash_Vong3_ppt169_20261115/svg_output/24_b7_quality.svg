    <g font-size="13" fill="#4A5570">
      <text><tspan x="300" y="206">5 bản cùng số chứng từ, ví dụ EV00482 và</tspan><tspan x="300" dy="18">EV00484 (DN-CT0043-02), cách nhau 2 phút</tspan></text>
