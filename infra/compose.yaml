name: codecash-local
services:
  mongo:
    image: mongo:7.0.16
    restart: unless-stopped
    command: ["--replSet", "rs0", "--bind_ip_all"]
    ports: ["127.0.0.1:27017:27017"]
    volumes: ["mongo-data:/data/db"]
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "try { rs.status().ok } catch (e) { rs.initiate({_id:'rs0',members:[{_id:0,host:'localhost:27017'}]}).ok }"]
      interval: 10s
      timeout: 5s
      retries: 5
  # Optional: STORAGE_DRIVER=postgres (pnpm infra:up:pg). Local development only.
  postgres:
    image: postgres:17.6
    profiles: ["postgres"]
    restart: unless-stopped
    environment:
      POSTGRES_USER: codecash
      POSTGRES_PASSWORD: codecash
      POSTGRES_DB: codecash
    ports: ["127.0.0.1:5432:5432"]
    volumes: ["postgres-data:/var/lib/postgresql/data"]
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "codecash", "-d", "codecash"]
      interval: 5s
      timeout: 5s
      retries: 10
volumes:
  mongo-data:
  postgres-data:
